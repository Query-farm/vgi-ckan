# vgi-lint settings for this worker: https://github.com/Query-farm/vgi-lint-check
# `make lint-explain`, `vgi-lint lint` in this directory, and CI's metadata job all
# read this file. Look up a rule with `vgi-lint explain VGI123`; print the metadata tag
# contract with `vgi-lint spec`.

# The worker to attach, relative to this directory. Build it first with `make build`.
location = ".venv/bin/vgi-ckan-worker"

# Fail on warnings while you build. Raise this to "info" before you publish the worker.
fail_on = "info"

# Waive a finding only with a kind and a reason, so the waiver can be audited:
#   domain-exemption  permanent and legitimate for this worker
#   deferred          a real defect you will fix; add expires = "YYYY-MM-DD"
#   timing            slow or flaky because of the environment, not the metadata
#   tooling-bug       the linter is wrong; report it upstream
ignore = [
  # { code = "VGI146", kind = "domain-exemption", reason = "every entry point needs a key" },
  # The zero-argument overloads of organizations/groups/licenses/portal_info read the portal from the
  # ATTACH PORTAL option; they are the same functions as the one-argument forms, not fixed datasets,
  # and a catalog table could not exist when the worker is attached without a portal.
  { code = "VGI311", kind = "domain-exemption", reason = "no-argument overloads take the portal from the ATTACH PORTAL option" },
]

# Adopting the gate on a worker that already has findings? Record them once with
#   vgi-lint lint --baseline vgi-lint-baseline --update-baseline
# and uncomment the next line. Only new findings fail after that.
# baseline = "vgi-lint-baseline"

# datastore / datastore_sql / resource_data return the columns of whatever remote DataStore table
# (or SQL select list) the arguments name, so no declared variant table can list them. The fixed
# parts (_id, and resource_data's plain-file shape) are declared in vgi.result_dynamic_columns_md;
# test/sql/datastore.test pins the typed shapes by DESCRIBE against the recorded portals.
[per_object."ckan.main.datastore"]
ignore = [{ code = "VGI910", kind = "domain-exemption", reason = "columns are the remote DataStore table's own fields; _id is declared, the rest are pinned by DESCRIBE tests" }]
[per_object."ckan.main.datastore_sql"]
ignore = [{ code = "VGI910", kind = "domain-exemption", reason = "columns are the caller's SQL select list; types are pinned by DESCRIBE tests" }]
[per_object."ckan.main.resource_data"]
ignore = [{ code = "VGI910", kind = "domain-exemption", reason = "the DataStore shape's columns are the remote table's fields; the plain-file shape is declared" }]
